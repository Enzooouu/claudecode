<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="jogo">
    <h1>Cobrinha</h1>

    <div class="placar">
      <div class="placar-item">
        <span class="placar-rotulo">Pontos</span>
        <strong id="pontuacao">0</strong>
      </div>
      <div class="placar-item">
        <span class="placar-rotulo">Recorde</span>
        <strong id="recorde">0</strong>
      </div>
    </div>

    <div class="tabuleiro">
      <canvas id="canvas" width="400" height="400"></canvas>

      <div id="mensagem" class="mensagem">
        <h2 id="titulo-mensagem" class="titulo-mensagem oculto"></h2>
        <p id="texto-mensagem">Pressione uma seta para começar</p>
        <button id="botao-jogar" class="oculto" type="button">Jogar de novo</button>
      </div>
    </div>

    <p class="dica">Use as setas do teclado para mover</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
